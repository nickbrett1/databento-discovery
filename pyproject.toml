[project]
name = "databento-discovery"
version = "0.1.0"
description = "A databento-discovery project generated with genproj"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databento>=0.40",
    "mcp>=1.2.0,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
